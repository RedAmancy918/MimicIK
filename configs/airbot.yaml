# Portable MIP recipe. AIRBOT training data are not distributed in this release.
task:
  obs_dim: 20
  act_dim: 6
  obs_steps: 2
  horizon: 1
  act_steps: 1
  val_dataset_percentage: 0.1
  fk_loss_weight: 0.0
network:
  network_type: sudeepdit
  encoder_type: mlp
  emb_dim: 256
  num_layers: 8
  num_encoder_layers: 2
  encoder_dropout: 0.0
  dropout: 0.1
  timestep_emb_dim: 128
  timestep_emb_type: positional
  n_heads: 4
optimization:
  loss_type: mip
  norm_type: l2
  loss_scale: 1.0
  t_two_step: 0.9
  seed: 0
  lr: 0.0001
  weight_decay: 0.00001
  gradient_steps: 300000
  batch_size: 512
  grad_clip_norm: 10.0
  ema_rate: 0.995
training:
  split_seed: 0
  torch_threads: 2
  log_every: 100
  eval_every: 20000
  save_every: 5000
