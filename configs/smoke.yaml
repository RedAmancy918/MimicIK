# Tiny CPU integration check only; not a useful pretrained robot controller.
task:
  obs_dim: 20
  act_dim: 6
  obs_steps: 2
  horizon: 1
  act_steps: 1
  val_dataset_percentage: 0.25
  fk_loss_weight: 0.0
network:
  network_type: sudeepdit
  encoder_type: mlp
  emb_dim: 16
  num_layers: 1
  num_encoder_layers: 1
  encoder_dropout: 0.0
  dropout: 0.0
  timestep_emb_dim: 8
  timestep_emb_type: positional
  n_heads: 2
optimization:
  loss_type: mip
  norm_type: l2
  loss_scale: 1.0
  t_two_step: 0.9
  seed: 0
  lr: 0.001
  weight_decay: 0.00001
  gradient_steps: 10
  batch_size: 8
  grad_clip_norm: 10.0
  ema_rate: 0.9
training:
  split_seed: 0
  torch_threads: 2
  log_every: 5
  eval_every: 10
  save_every: 5
