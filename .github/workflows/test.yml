name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,fk,dev]'
      - run: python -m pytest -q
      - run: python examples/make_demo_data.py --output data/demo
      - run: python -m mimicik.training --config configs/smoke.yaml --data data/demo --output runs/smoke --device cpu --steps 3
      - run: python examples/infer.py --checkpoint runs/smoke/final
      - run: python -m build
