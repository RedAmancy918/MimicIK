[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimicik"
version = "0.1.0"
description = "Two-call, demonstration-conditioned end-effector to joint-motion decoding"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{name = "Jiahao Yang and MimicIK contributors"}]
dependencies = ["numpy>=1.26,<3", "torch>=2.4,<3", "safetensors>=0.5,<1"]

[project.optional-dependencies]
train = ["pyarrow>=17", "PyYAML>=6"]
fk = ["pytorch-kinematics>=0.9,<0.11"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.urls]
Homepage = "https://redamancy918.github.io/MimicIK/"
Repository = "https://github.com/RedAmancy918/MimicIK"
Paper = "https://arxiv.org/abs/2606.15148"
Models = "https://huggingface.co/vistar918/MimicIK"
Issues = "https://github.com/RedAmancy918/MimicIK/issues"

[tool.setuptools.packages.find]
include = ["mimicik*"]

[tool.setuptools.package-data]
mimicik = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
